<main class="seal">
  <header class="babu">
    <h1 class="title">welcome to shixun's cultivation cavern ♡</h1>
  </header>

  <section class="dreepy" aria-label="draw settings">
    <div class="row">
      <span class="label">to ascend, one must gain more merits</span>
      <div class="button-group" id="chips" role="group" aria-label="more merits please">
        <button type="button" class="toggle-btn" data-category="winter" aria-pressed="false">feeling festive</button>
        <button type="button" class="toggle-btn" data-category="spicy" aria-pressed="false">feeling spicy</button>
      </div>
    </div>

    <div class="sword-flight">
      <button type="button" class="mortal" id="generate-btn">
        <span class="mortal-text">today's drabble:</span>
      </button>
    </div>
  </section>

  <section class="stage" aria-label="drawn lines">
    <article class="post" id="post">
      <ol class="lines" id="lines" aria-live="polite">
        <li class="idle" id="idle-msg">what will today's drabble be?</li>

        <li id="genre-box" class="result-box hidden">
          <span class="result-label">Genre</span>
          <p class="result" id="genre"></p>
        </li>

        <li id="trope-box" class="result-box hidden">
          <span class="result-label">AU / Trope</span>
          <p class="result" id="trope"></p>
        </li>

        <li id="winter-box" class="result-box hidden">
          <span class="result-label">Festive Tidbit</span>
          <p class="result"></p>
        </li>

        <li id="spicy-box" class="result-box hidden">
          <span class="result-label">Holiday Spice</span>
          <p class="result"></p>
        </li>
      </ol>
    </article>
  </section>
        <script type="text/javascript" src="devil-drabble.js"></script><noscript>this page requires javascript</noscript>
    </main>
  </body>
</html>
