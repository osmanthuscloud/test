
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drabble Prompt</title>
    <link href="/art/style2026.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
      

<!-- Optional Google Font for authentic typewriter look -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<main class="scrapbook-page">
  <!-- Editorial Top Header -->
  <header class="scrapbook-header">
    <span class="stamp-tag" aria-hidden="true">❄ no. 25</span>
    <h1 class="title">welcome to shixun's cultivation cavern</h1>
    <p class="subtitle">to ascend, one must gain more merits — select your seasonal tidbits to earn karmic rewards.</p>
  </header>

  <!-- Main Two-Column Scrapbook Spread -->
  <div class="scrapbook-spread">
    <!-- Left Column: Checklist Toggles & Draw Action -->
    <section class="dreepy" aria-label="draw settings">
      <div class="checklist-group" id="chips" role="group" aria-label="more merits please">
        <button type="button" class="toggle-btn" data-category="winter" aria-pressed="false">
          <span class="underline-label">feeling festive</span>
          <span class="ink-dot" aria-hidden="true"></span>
        </button>

        <button type="button" class="toggle-btn" data-category="spicy" aria-pressed="false">
          <span class="underline-label">feeling spicy</span>
          <span class="ink-dot" aria-hidden="true"></span>
        </button>
      </div>

      <div class="sword-flight">
        <button type="button" class="mortal" id="generate-btn">
          <span class="mortal-text">today's drabble →</span>
        </button>
      </div>
<div class="music-box-widget">
  <button type="button" class="music-btn" id="music-toggle" aria-pressed="false">
    <span class="music-icon" id="music-icon">♪</span>
    <span class="music-label" id="music-label">heaven's guqin box</span>
  </button>

  <div class="melody-switcher">
    <span class="melody-prefix">tune:</span>
    <button type="button" class="melody-cycle-btn" id="melody-cycle" title="Switch TGCF theme">
      no separation ↻
    </button>
  </div>
</div>

      
      
    </section>

    <!-- Right Column: Pinned Polaroid-Style Prompt Card -->
    <section class="stage" aria-label="drawn lines">
      <article class="polaroid-card" id="post">
        <!-- Decorative Binder Clip Accent -->
        <div class="binder-clip" aria-hidden="true">📎</div>

        <ol class="lines" id="lines" aria-live="polite">
          <li class="idle" id="idle-msg">what will today's drabble be?</li>

          <li id="genre-box" class="result-box hidden">
            <div class="result-header">
              <span class="result-label">genre</span>
              <button type="button" class="reroll-btn" data-reroll="genre" aria-label="Reroll Genre">reroll</button>
            </div>
            <p class="result" id="genre"></p>
          </li>

          <li id="trope-box" class="result-box hidden">
            <div class="result-header">
              <span class="result-label">au / trope</span>
              <button type="button" class="reroll-btn" data-reroll="trope" aria-label="Reroll AU or Trope">reroll</button>
            </div>
            <p class="result" id="trope"></p>
          </li>

          <li id="winter-box" class="result-box hidden">
            <div class="result-header">
              <span class="result-label">festive tidbit</span>
              <button type="button" class="reroll-btn" data-reroll="winter" aria-label="Reroll Festive Tidbit">reroll</button>
            </div>
            <p class="result"></p>
          </li>

          <li id="spicy-box" class="result-box hidden">
            <div class="result-header">
              <span class="result-label">holiday spice</span>
              <button type="button" class="reroll-btn" data-reroll="spicy" aria-label="Reroll Holiday Spice">reroll</button>
            </div>
            <p class="result"></p>
          </li>
        </ol>

        <div class="polaroid-caption" aria-hidden="true">merry holidays</div>
      </article>
    </section>
  </div>

  <!-- Minimalist Centered Page Number Footer -->
  <footer class="page-footer" aria-hidden="true">25</footer>
</main>
